name: Sajiva Live Smoke Test
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "tests/live/**"
      - ".github/workflows/live-smoke.yml"
      - "package.json"
      - "playwright.config.ts"

concurrency:
  group: sajiva-live-smoke
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Wait for production to serve G5 HTML
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl --max-time 15 -fsSL https://demo-sajiva.pages.dev/ | grep -q 'Versi situs: G5'; then
              echo "G5 live deployment marker confirmed"
              exit 0
            fi
            echo "Waiting for Cloudflare G5 version ($i/30)"
            sleep 15
          done
          echo "::error::Live site did not serve G5 marker after waiting"
          exit 1
      - name: Run browser smoke
        run: npx playwright test tests/live --reporter=line
        env:
          SAJIVA_LIVE_URL: https://demo-sajiva.pages.dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sajiva-live-failure
          path: test-results/
          retention-days: 7
